<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Origami — PDF tools that fold, flip &amp; fly</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f6f4ef;--card:#fffdf9;--ink:#1b1a22;--mut:#77737f;--line:#e6e1d8;--a:#ff5a4f;--b:#ff9a3c;--c:#7a5cff;--ok:#18b67a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0d13;--card:#17151f;--ink:#f3f1f8;--mut:#8f8a9c;--line:#272433}}
:root[data-theme="dark"]{--bg:#0e0d13;--card:#17151f;--ink:#f3f1f8;--mut:#8f8a9c;--line:#272433}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.35;z-index:0;pointer-events:none;animation:float 14s ease-in-out infinite}
.b1{width:380px;height:380px;background:var(--a);top:-120px;left:-80px}
.b2{width:340px;height:340px;background:var(--c);top:30%;right:-120px;animation-delay:-5s}
.b3{width:300px;height:300px;background:var(--b);bottom:-120px;left:30%;animation-delay:-9s}
@keyframes float{50%{transform:translate(40px,-50px) scale(1.15)}}
main{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:56px 20px 40px}
.hero{text-align:center;margin-bottom:34px}
.logo{font-size:46px;display:inline-block;animation:fly 4s ease-in-out infinite;transform-origin:center}
@keyframes fly{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-12px) rotate(6deg)}}
h1{margin:6px 0 6px;font-size:clamp(38px,8vw,64px);letter-spacing:-.04em;line-height:1;background:linear-gradient(100deg,var(--a),var(--b),var(--c),var(--a));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
@keyframes shine{to{background-position:300% 0}}
.hero p{color:var(--mut);margin:0;animation:rise .8s .15s both}
.search{display:block;margin:26px auto 0;width:min(420px,100%);padding:12px 18px;border-radius:100px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;outline:none;transition:box-shadow .25s,border-color .25s;animation:rise .8s .3s both}
.search:focus{border-color:var(--a);box-shadow:0 0 0 4px color-mix(in srgb,var(--a) 20%,transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;cursor:pointer;text-align:left;color:inherit;font:inherit;opacity:0;animation:rise .6s calc(var(--i)*55ms + .35s) cubic-bezier(.2,.8,.2,1) forwards;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,border-color .3s}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(240px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--a) 22%,transparent),transparent 60%);opacity:0;transition:opacity .3s}
.card:hover{transform:translateY(-5px) rotate(-.4deg);border-color:var(--a);box-shadow:0 16px 36px -14px color-mix(in srgb,var(--a) 55%,transparent)}
.card:hover::before{opacity:1}
.card .ic{font-size:28px;display:block;margin-bottom:12px;transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.card:hover .ic{transform:scale(1.25) rotate(-8deg)}
.card b{display:block;font-size:15.5px;position:relative}
.card span.d{display:block;color:var(--mut);font-size:12.8px;margin-top:3px;position:relative}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
footer{text-align:center;color:var(--mut);font-size:12.5px;margin-top:34px}
#ov{position:fixed;inset:0;z-index:10;display:none;align-items:flex-end;justify-content:center;background:rgba(10,8,18,.55);backdrop-filter:blur(6px);padding:16px}
#ov.on{display:flex;animation:fade .25s both}
@media (min-width:640px){#ov{align-items:center}}
@keyframes fade{from{opacity:0}}
#sheet{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;position:relative;animation:pop .45s cubic-bezier(.2,1.2,.3,1) both}
@keyframes pop{from{opacity:0;transform:translateY(40px) scale(.94)}}
#sheet h2{margin:0;font-size:21px;letter-spacing:-.02em}
#sheet .sub{color:var(--mut);font-size:13px;margin:2px 0 16px}
.x{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;transition:transform .3s}
.x:hover{transform:rotate(90deg)}
.dz{border:2px dashed var(--line);border-radius:16px;padding:26px 12px;text-align:center;color:var(--mut);cursor:pointer;transition:all .25s}
.dz:hover,.dz.drag{border-color:var(--a);color:var(--ink);background:color-mix(in srgb,var(--a) 7%,transparent);transform:scale(1.015)}
.dz i{font-style:normal;font-size:26px;display:block;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.fl{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.fi{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:13px;animation:rise .3s both}
.fi .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi button{border:0;background:none;color:var(--mut);cursor:pointer;font-size:14px;padding:2px 5px;border-radius:6px}
.fi button:hover{color:var(--a);background:var(--card)}
label.f{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px}
.in{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;outline:none}
.in:focus{border-color:var(--a)}
.go{margin-top:18px;width:100%;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(110deg,var(--a),var(--b),var(--a));background-size:200% 100%;transition:transform .2s,background-position .6s,opacity .2s}
.go:hover:not(:disabled){transform:translateY(-2px);background-position:100% 0}
.go:active:not(:disabled){transform:scale(.98)}
.go:disabled{opacity:.4;cursor:default}
.bar{height:4px;border-radius:4px;margin-top:14px;background:var(--line);overflow:hidden;display:none}
.bar.on{display:block}
.bar::after{content:"";display:block;height:100%;width:40%;border-radius:4px;background:linear-gradient(90deg,var(--a),var(--c));animation:slide 1.1s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
#st{margin-top:10px;font-size:13px;color:var(--mut);min-height:20px}
#st.err{color:var(--a)}
.dl{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;padding:12px;border-radius:14px;background:var(--ok);color:#fff;font-weight:700;text-decoration:none;animation:pop .5s cubic-bezier(.2,1.4,.3,1) both}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.mini{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;transition:transform .2s,border-color .2s}
.mini:hover{border-color:var(--a);transform:translateY(-1px)}.mini.pri,.amts .mini.on{background:var(--a);border-color:var(--a);color:#fff;font-weight:700}
.sp{width:100%;background:#fff;border-radius:12px;border:1px solid var(--line);touch-action:none;cursor:crosshair}
.pgw{position:relative;margin-top:8px;border-radius:8px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.25)}.pgw canvas{display:block;width:100%;height:auto}
.ov{position:absolute;cursor:move;touch-action:none;border:1.5px dashed transparent}.ov.sel{border-color:#2f7bff}.ov img{width:100%;display:block;pointer-events:none}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
.ths{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.th{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px;text-align:center;animation:rise .35s both}
.th .im{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;overflow:hidden}.th img{max-width:100%;max-height:100%;transition:transform .35s}
.th small{color:var(--mut);font-size:11px}.tb{display:flex;justify-content:center;gap:2px;margin-top:3px}.tb button{border:0;background:none;color:var(--mut);cursor:pointer;padding:2px 4px;border-radius:6px;font-size:13px}.tb button:hover{color:var(--a);background:var(--card)}
.support{margin-top:40px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px 18px;animation:rise .8s 1s both}
.support h3{margin:0 0 4px}.support p{margin:0 0 18px;color:var(--mut);font-size:13px}
.sg{display:flex;gap:28px;justify-content:center;align-items:center;flex-wrap:wrap}
#qr{background:#fff;padding:10px;border-radius:14px;line-height:0;animation:bob 3s ease-in-out infinite}
.sr{display:flex;flex-direction:column;gap:10px;align-items:center;max-width:280px}
.amts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.upi{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;font-size:13px}
a.pay{display:block;text-decoration:none;text-align:center;width:100%;margin:0}
.stg{display:block;height:58px;margin-bottom:10px;position:relative}.stg svg{height:100%;width:auto;overflow:visible}
.stg *{transition:transform .7s cubic-bezier(.3,1.4,.4,1),opacity .45s,fill .5s,stroke-dashoffset 1.1s ease;transform-box:fill-box;transform-origin:center}
.stg .pp{fill:var(--bg);stroke:var(--mut);stroke-width:1.5}.stg .ln{stroke:var(--mut);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.stg .fa{fill:var(--a)}.stg .fb{fill:var(--b)}.stg .fc{fill:var(--c)}
.stg .hid{opacity:0;transform:scale(.4)}
.card:is(:hover,:focus-visible) .m1{transform:translateX(14px)}.card:is(:hover,:focus-visible) .m2{transform:translateX(-14px)}
.card:is(:hover,:focus-visible) .mk{opacity:1;transform:scale(1)}
.card:is(:hover,:focus-visible) .s1{transform:translateX(-9px) rotate(-7deg)}.card:is(:hover,:focus-visible) .s2{transform:translateX(9px) rotate(7deg)}
.stg .cut{stroke:var(--a);stroke-width:1.5;stroke-dasharray:3 3;opacity:0}.card:is(:hover,:focus-visible) .cut{opacity:1}
.card:is(:hover,:focus-visible) .rt{transform:rotate(90deg)}
.card:is(:hover,:focus-visible) .o1{transform:translateX(42px)}.card:is(:hover,:focus-visible) .o3{transform:translateX(-42px)}.card:is(:hover,:focus-visible) .o2{transform:translateY(-7px)}
.stg .sg{stroke:var(--a);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;fill:none;stroke-dasharray:1;stroke-dashoffset:1}.card:is(:hover,:focus-visible) .sg{stroke-dashoffset:0}
.card:is(:hover,:focus-visible) .cm{transform:scale(.55)}.card:is(:hover,:focus-visible) .ca1{transform:translateX(7px)}.card:is(:hover,:focus-visible) .ca2{transform:translateX(-7px)}
.card:is(:hover,:focus-visible) .i1{opacity:0;transform:scale(.6) rotate(-14deg)}.card:is(:hover,:focus-visible) .i2{opacity:1;transform:none}
.stg .i2{opacity:0;transform:scale(.6) rotate(14deg)}.stg .j2{opacity:0;transform:scale(.6) rotate(-14deg)}
.card:is(:hover,:focus-visible) .j1{opacity:0;transform:scale(.6) rotate(14deg)}.card:is(:hover,:focus-visible) .j2{opacity:1;transform:none}
.stg .sh{transform-origin:100% 100%}.card:is(:hover,:focus-visible) .sh{transform:translateY(-7px) rotate(-22deg)}.card:is(:hover,:focus-visible) .lb{fill:var(--ok)}
.logo polygon{stroke-linejoin:round;stroke-width:3}.cb{fill:var(--a);stroke:var(--a)}.cw{fill:var(--b);stroke:var(--b)}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<main>
  <div class="hero">
    <svg id="lg" class="logo" viewBox="0 0 100 100" width="68" height="68"><polygon class="cb"/><polygon class="cw"/></svg>
    <h1>Origami</h1>
    <p>PDF tools that fold, flip &amp; fly — all inside your browser. Files never leave your device.</p>
    <input class="search" id="q" type="search" placeholder="Find a tool… merge, split, compress">
  </div>
  <div class="grid" id="grid"></div>
  <section class="support"><h3>❤️ Support Origami</h3><p>Made by <b>Gagandeep Singh</b> — if this saved you time, chip in for hosting &amp; coffee.</p>
<div class="sg"><div id="qr"></div><div class="sr">
<div class="amts"><button class="mini" data-a="49">₹49</button><button class="mini" data-a="99">₹99</button><button class="mini" data-a="199">₹199</button><button class="mini" data-a="499">₹499</button></div>
<input class="in" id="ca" type="number" min="1" placeholder="Custom amount ₹" style="width:170px;text-align:center">
<div class="upi"><code>8463083061@sbi</code><button class="mini" id="cp">Copy</button></div>
<a class="go pay" id="pay" href="#">📱 Pay via UPI app</a></div></div></section>
<footer>Everything runs locally in this tab.</footer>
</main>
<div id="ov"><div id="sheet"></div></div>

<script>
const {PDFDocument,degrees,rgb,StandardFonts}=PDFLib;
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const buf=f=>f.arrayBuffer();
const pdfBlob=b=>new Blob([b],{type:'application/pdf'});
const base=f=>f.name.replace(/\.[^.]+$/,'');
const toBlob=(c,t,q)=>new Promise(r=>c.toBlob(r,t,q));

async function cleanDoc(bytes){
  const src=await PDFDocument.load(bytes,{ignoreEncryption:true});
  const out=await PDFDocument.create();
  (await out.copyPages(src,src.getPageIndices())).forEach(p=>out.addPage(p));
  return out;
}
async function openPdf(bytes,pw){
  try{return await pdfjsLib.getDocument({data:bytes.slice(0),password:pw||''}).promise;}
  catch(e){if(e&&e.name==='PasswordException')throw new Error('This PDF needs the right password.');throw e;}
}
async function renderPage(page,scale){
  const vp=page.getViewport({scale});
  const c=document.createElement('canvas');c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:x,viewport:vp}).promise;return c;
}
async function rasterize(bytes,scale,q,st,pw,txt){
  const pdf=await openPdf(bytes,pw),out=await PDFDocument.create();
  const font=txt?await out.embedFont(StandardFonts.Helvetica):null;
  for(let i=1;i<=pdf.numPages;i++){
    st(`Page ${i} of ${pdf.numPages}…`);
    const pg=await pdf.getPage(i),b=pg.getViewport({scale:1});
    const c=await renderPage(pg,scale);
    const img=await out.embedJpg(new Uint8Array(await (await toBlob(c,'image/jpeg',q)).arrayBuffer()));
    const np=out.addPage([b.width,b.height]);np.drawImage(img,{x:0,y:0,width:b.width,height:b.height});
    if(txt){try{const tc=await pg.getTextContent();for(const it of tc.items){
      const s=(it.str||'').replace(/[^\x20-\x7E\xA0-\xFF]/g,'');if(!s.trim())continue;
      const size=Math.max(1,Math.hypot(it.transform[2],it.transform[3])||8);
      np.drawText(s,{x:it.transform[4],y:it.transform[5],size,font,opacity:0});}}catch(e){}}
    c.width=c.height=0;
  }
  return out.save();
}
function parseRange(s,max){
  const o=new Set();
  s.split(',').forEach(p=>{p=p.trim();if(!p)return;
    if(p.includes('-')){const[a,b]=p.split('-').map(n=>parseInt(n,10));for(let i=a;i<=b;i++)if(i>=1&&i<=max)o.add(i-1);}
    else{const n=parseInt(p,10);if(n>=1&&n<=max)o.add(n-1);}});
  return[...o].sort((a,b)=>a-b);
}

const TOOLS=[
 {id:'merge',ic:'📎',t:'Merge',d:'Combine PDFs in any order',multi:1,acc:'application/pdf',min:2,
  async run(fs,o,st){st('Merging…');const m=await PDFDocument.create();
   for(const f of fs){const s=await PDFDocument.load(await buf(f),{ignoreEncryption:true});(await m.copyPages(s,s.getPageIndices())).forEach(p=>m.addPage(p));}
   return[{blob:pdfBlob(await m.save()),name:'merged.pdf'}];}},
 {id:'split',ic:'✂️',t:'Split',d:'Extract pages or split every page',acc:'application/pdf',
  opts:[{k:'mode',l:'Mode',s:[['range','Extract a page range'],['each','One file per page (zip)']]},{k:'range',l:'Pages (e.g. 1-3,5,8-9)',v:'1-3'}],
  async run(fs,o,st){st('Splitting…');const s=await PDFDocument.load(await buf(fs[0]),{ignoreEncryption:true});
   if(o.mode==='range'){const ix=parseRange(o.range,s.getPageCount());if(!ix.length)throw new Error('Enter a valid page range.');
    const out=await PDFDocument.create();(await out.copyPages(s,ix)).forEach(p=>out.addPage(p));return[{blob:pdfBlob(await out.save()),name:base(fs[0])+'-pages.pdf'}];}
   const z=new JSZip();for(let i=0;i<s.getPageCount();i++){const out=await PDFDocument.create();const[p]=await out.copyPages(s,[i]);out.addPage(p);z.file(`page-${i+1}.pdf`,await out.save());}
   return[{blob:await z.generateAsync({type:'blob'}),name:base(fs[0])+'-pages.zip'}];}},
 {id:'rotate',ic:'🔄',t:'Rotate',d:'Turn pages left, right or upside down',acc:'application/pdf',
  opts:[{k:'a',l:'Direction & degrees',s:[['90','↻ 90° — turn to the right (clockwise)'],['270','↺ 90° — turn to the left (counter-clockwise)'],['180','⟳ 180° — upside down']]},{k:'pg',l:'Pages — leave blank for all (e.g. 1,3-5)',v:''}],
  async run(fs,o,st){const d=await cleanDoc(await buf(fs[0]));const ps=d.getPages();
   const ix=o.pg.trim()?parseRange(o.pg,ps.length):ps.map((_,i)=>i);if(!ix.length)throw new Error('Enter a valid page list.');
   ix.forEach(i=>ps[i].setRotation(degrees(((ps[i].getRotation().angle||0)+parseInt(o.a,10))%360)));
   st(`Rotated ${ix.length} page${ix.length>1?'s':''} ✨`);
   return[{blob:pdfBlob(await d.save()),name:base(fs[0])+'-rotated.pdf',keep:1}];}},
 {id:'organize',ic:'🗂️',t:'Organize',d:'Reorder, rotate or delete pages',acc:'application/pdf',
  async ui(fs,box,st){
   if(!fs[0]){box.innerHTML='';this.f=null;return;}
   if(this.f===fs[0])return;this.f=fs[0];
   const pdf=await openPdf(await buf(fs[0]));this.pg=[];
   for(let i=1;i<=pdf.numPages;i++){st(`Loading page ${i}…`);const c=await renderPage(await pdf.getPage(i),.3);this.pg.push({i:i-1,r:0,u:c.toDataURL()});}
   st('');this.draw(box);},
  draw(box){const t=this;box.innerHTML='<div class="ths"></div>';const w=box.firstChild;
   this.pg.forEach((p,k)=>{const d=document.createElement('div');d.className='th';
    d.innerHTML=`<div class="im"><img src="${p.u}" style="transform:rotate(${p.r}deg)"></div><small>Page ${p.i+1}</small><div class="tb"><button title="Move left">←</button><button title="Rotate left">↺</button><button title="Rotate right">↻</button><button title="Move right">→</button><button title="Delete">✕</button></div>`;
    const b=d.querySelectorAll('button');
    b[0].onclick=()=>{if(k>0){[t.pg[k-1],t.pg[k]]=[t.pg[k],t.pg[k-1]];t.draw(box);}};
    b[1].onclick=()=>{p.r=(p.r+270)%360;t.draw(box);};
    b[2].onclick=()=>{p.r=(p.r+90)%360;t.draw(box);};
    b[3].onclick=()=>{if(k<t.pg.length-1){[t.pg[k+1],t.pg[k]]=[t.pg[k],t.pg[k+1]];t.draw(box);}};
    b[4].onclick=()=>{t.pg.splice(k,1);t.draw(box);};
    w.appendChild(d);});},
  async run(fs,o,st){if(!this.pg||!this.pg.length)throw new Error('Keep at least one page.');st('Saving…');
   const s=await PDFDocument.load(await buf(fs[0]),{ignoreEncryption:true});const out=await PDFDocument.create();
   const cp=await out.copyPages(s,this.pg.map(p=>p.i));
   cp.forEach((p,k)=>{if(this.pg[k].r)p.setRotation(degrees(((p.getRotation().angle||0)+this.pg[k].r)%360));out.addPage(p);});
   return[{blob:pdfBlob(await out.save()),name:base(fs[0])+'-organized.pdf'}];}},
 {id:'sign',ic:'✍️',t:'Sign',d:'Draw or type, then drag into place',acc:'application/pdf',
  async ui(fs,box,st){

 {id:'compress',ic:'🗜️',t:'Compress',d:'Shrink size — never hands back a bigger file',acc:'application/pdf',
  opts:[{k:'m',l:'Mode',s:[['safe','Light — keeps text & quality'],['max','Maximum — pages become images (text stays selectable)']]},{k:'l',l:'Level (Maximum mode only)',s:[['h','Smallest'],['m','Balanced'],['l','Best quality']],v:'m'}],
  async run(fs,o,st){const b=new Uint8Array(await buf(fs[0]));const c=[{b,n:'original'}];
   st('Optimizing structure…');
   try{const d=await PDFDocument.load(b,{ignoreEncryption:true,updateMetadata:false});c.push({b:await d.save({useObjectStreams:true}),n:'optimized'});}catch(e){}
   if(o.m==='max'){const P=[{h:[.8,.5],m:[1.1,.7],l:[1.5,.85]}[o.l],[.7,.4],[.55,.3]];
    for(const[sc,q]of P){const r=await rasterize(b,sc,q,st,'',true);c.push({b:r,n:'rendered'});if(r.byteLength<b.byteLength*.9)break;}}
   const best=c.reduce((x,y)=>y.b.byteLength<x.b.byteLength?y:x),f=k=>(k/1024).toFixed(0)+' KB';
   st(best.n==='original'?`Already well optimized — original kept (${f(b.byteLength)}). Try Maximum mode for more.`:`${f(b.byteLength)} → ${f(best.b.byteLength)} (${Math.round((1-best.b.byteLength/b.byteLength)*100)}% smaller)`);
   return[{blob:pdfBlob(best.b),name:base(fs[0])+(best.n==='original'?'.pdf':'-compressed.pdf'),keep:1}];}},
 {id:'imgcompress',ic:'🖼️',t:'Compress Image',d:'Shrink JPG, PNG or WebP in bulk',multi:1,acc:'image/*',min:1,
  opts:[{k:'f',l:'Output format',s:[['keep','Keep original'],['jpeg','JPG'],['webp','WebP']]},{k:'q',l:'Quality (PNG stays lossless — use resize)',s:[['.9','High'],['.7','Balanced'],['.5','Small'],['.3','Tiny']],v:'.7'},{k:'m',l:'Max width/height in px (0 = keep size)',v:'0',n:1}],
  async run(fs,o,st){const out=[];let b0=0,b1=0;
   for(const f of fs){st('Compressing '+f.name+'…');const bm=await createImageBitmap(f);let w=bm.width,h=bm.height;const m=+o.m||0;
    if(m&&Math.max(w,h)>m){const r=m/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
    const mime=o.f==='keep'?(f.type==='image/png'?'image/png':f.type==='image/webp'?'image/webp':'image/jpeg'):'image/'+o.f;

   st(`${(b0/1024).toFixed(0)} KB → ${(b1/1024).toFixed(0)} KB (${Math.round((1-b1/b0)*100)}% smaller)`);

 {id:'img2pdf',ic:'🖼️',t:'Images → PDF',d:'One page per image, in order',multi:1,acc:'image/*',min:1,
  async run(fs,o,st){const d=await PDFDocument.create();
   for(const f of fs){st('Adding '+f.name+'…');let img;const b=new Uint8Array(await buf(f));

   return[{blob:pdfBlob(await d.save()),name:'images.pdf'}];}},

const L3='<path class="ln" d="M',PG=(x,y)=>`${L3}${x} ${y}h14M${x} ${y+7}h14M${x} ${y+14}h9"/>`;

const DOC=(c,x,y)=>`<g class="${c}"><rect class="pp" x="${x}" y="${y}" width="28" height="40" rx="3"/>${PG(x+7,y+10)}</g>`;

const grid=$('grid');
function renderGrid(){
  const q=$('q').value.trim().toLowerCase();
  grid.innerHTML='';
  const list=TOOLS.filter(t=>(t.t+' '+t.d).toLowerCase().includes(q));
  if(!list.length){grid.innerHTML='<p style="grid-column:1/-1;text-align:center;color:var(--mut)">No tool matches that.</p>';return;}
  list.forEach((t,i)=>{
    const c=document.createElement('button');c.className='card';c.style.setProperty('--i',i);
    c.innerHTML=`<span class="stg">${ANIM[t.id]||t.ic}</span><b>${t.t}</b><span class="d">${t.d}</span>`;
    c.onmousemove=e=>{const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px');};
    c.onclick=()=>openTool(t);grid.appendChild(c);
  });
}
$('q').oninput=renderGrid;renderGrid();

const ov=$('ov'),sheet=$('sheet');let blobUrl=null;
function close(){ov.classList.remove('on');sheet.innerHTML='';if(blobUrl){URL.revokeObjectURL(blobUrl);blobUrl=null;}}
ov.onclick=e=>{if(e.target===ov)close();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});

function openTool(t){
  let files=[];const min=t.min||1;t.f=null;
  const opts=(t.opts||[]).map(f=>{
    const v=f.v!==undefined?f.v:'';
    const inp=f.s?`<select class="in" data-k="${f.k}">${f.s.map(([a,b])=>`<option value="${a}"${a===v?' selected':''}>${b}</option>`).join('')}</select>`
      :`<input class="in" data-k="${f.k}" type="${f.pw?'password':f.n?'number':'text'}" value="${esc(v)}" autocomplete="off">`;
    return`<label class="f">${f.l}</label>${inp}`;}).join('');
  sheet.innerHTML=`<button class="x" id="cl">✕</button><h2>${t.ic} ${t.t}</h2><div class="sub">${t.d}</div>
   <div class="dz" id="dz"><i>⬆</i>${t.multi?'Click or drop files here':'Click or drop a file here'}</div>
   <input type="file" id="fi" hidden accept="${t.acc}" ${t.multi?'multiple':''}>
   <div class="fl" id="fl"></div><div id="xtra"></div>${opts}
   <button class="go" id="go" disabled>${t.t}</button><div class="bar" id="bar"></div><div id="st"></div><div id="res"></div>`;
  ov.classList.add('on');
  $('cl').onclick=close;
  const dz=$('dz'),fi=$('fi');
  const add=l=>{l=[...l];if(!l.length)return;files=t.multi?files.concat(l):[l[0]];draw();};
  dz.onclick=()=>fi.click();fi.onchange=()=>{add(fi.files);fi.value='';};
  ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag');}));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag');}));
  dz.addEventListener('drop',e=>add(e.dataTransfer.files));
  function draw(){
    const fl=$('fl');fl.innerHTML='';
    files.forEach((f,i)=>{
      const d=document.createElement('div');d.className='fi';
      d.innerHTML=`<span class="n">${i+1}. ${esc(f.name)}</span>`;
      const mk=(s,fn)=>{const b=document.createElement('button');b.textContent=s;b.onclick=fn;d.appendChild(b);};
      if(t.multi){mk('↑',()=>{if(i>0){[files[i-1],files[i]]=[files[i],files[i-1]];draw();}});mk('↓',()=>{if(i<files.length-1){[files[i+1],files[i]]=[files[i],files[i+1]];draw();}});}
      mk('✕',()=>{files.splice(i,1);draw();});
      fl.appendChild(d);
    });
    $('go').disabled=files.length<min;
    $('res').innerHTML='';
    if(t.ui)Promise.resolve(t.ui(files,$('xtra'),st)).catch(e=>st(e.message||String(e),1));
  }
  const st=(m,err)=>{$('st').textContent=m;$('st').className=err?'err':'';};
  $('go').onclick=async()=>{
    const o={};sheet.querySelectorAll('[data-k]').forEach(e=>o[e.dataset.k]=e.value);
    $('go').disabled=true;$('bar').classList.add('on');$('res').innerHTML='';
    try{
      const out=await t.run(files,o,st);
      if(blobUrl)URL.revokeObjectURL(blobUrl);
      blobUrl=URL.createObjectURL(out[0].blob);
      $('res').innerHTML=`<a class="dl" href="${blobUrl}" download="${esc(out[0].name)}">⬇ Download ${esc(out[0].name)}</a>`;
      if(!out[0].keep)st('All done ✨');
    }catch(e){st(e.message||String(e),1);}
    $('bar').classList.remove('on');$('go').disabled=files.length<min;
  };
}
(()=>{const id='8463083061@sbi',nm='Gagandeep Singh';let amt=0;
 const uri=()=>`upi://pay?pa=${encodeURIComponent(id)}&pn=${encodeURIComponent(nm)}&cu=INR`+(amt>0?`&am=${amt}`:'');

(()=>{const L=$('lg');if(!L)return;const B=L.querySelector('.cb'),W=L.querySelector('.cw');
 const SB=[[50,12,88,50,50,88,12,50,12,50,12,50],[50,16,76,50,50,84,24,50,24,50,24,50],[8,32,40,56,66,72,74,48,92,18,50,44]];
 const SW=[[50,12,12,50,50,50,50,50,50,50,50,50],[50,16,24,50,50,50,50,50,50,50,50,50],[34,50,58,8,72,52,72,52,72,52,72,52]];
 const mix=(S,t)=>{const i=Math.min(1,Math.floor(t)),f=t-i,e=f*f*(3-2*f);return S[i].map((v,k)=>v+(S[i+1][k]-v)*e).reduce((a,v,k)=>a+(k%2?',':' ')+v.toFixed(1),'').trim();};
 let cur=0,tg=0,raf=0,last=0;
 const draw=()=>{B.setAttribute('points',mix(SB,Math.min(cur,1.999)));W.setAttribute('points',mix(SW,Math.min(cur,1.999)));};
 const tick=n=>{const dt=Math.min(50,n-last);last=n;cur+=Math.sign(tg-cur)*Math.min(Math.abs(tg-cur),dt/650);draw();raf=cur===tg?0:requestAnimationFrame(tick);};
 const go=v=>{tg=v;if(!raf){last=performance.now();raf=requestAnimationFrame(tick);}};
 draw();
 [L,document.querySelector('h1')].forEach(e=>{e.addEventListener('mouseenter',()=>go(2));e.addEventListener('mouseleave',()=>go(0));e.addEventListener('click',()=>go(tg?0:2));});
 setTimeout(()=>go(2),900);setTimeout(()=>go(0),4200);})();
